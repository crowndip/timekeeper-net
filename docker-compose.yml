version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: parental-control-db
    environment:
      POSTGRES_DB: parental_control
      POSTGRES_USER: pcadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - parental_control_db:/var/lib/postgresql/data
      - /opt/parental-control/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - parental-control-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  webservice:
    image: parental-control-webservice:latest
    container_name: parental-control-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=parental_control;Username=pcadmin;Password=${DB_PASSWORD}"
      AdminPassword: ${ADMIN_PASSWORD:-admin}
      LimitAdministratorPassword: ${LIMIT_ADMIN_PASSWORD}
    ports:
      - "8081:80"
    volumes:
      - parental_control_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parental-control-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: parental-control-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "8082:80"
    depends_on:
      - postgres
    networks:
      - parental-control-net
    restart: unless-stopped

volumes:
  parental_control_db:
    name: parental_control_db
  parental_control_keys:
    name: parental_control_keys

networks:
  parental-control-net:
    name: parental-control-net
    driver: bridge
